name: Build minimal Windows bridge
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-bridge/**'
      - '.github/workflows/build-bridge.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile .NET Framework executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path "windows-bridge/BridgeHost.cs" -OutputAssembly "windows-bridge/GeminiControlBridge.exe" -OutputType ConsoleApplication -ReferencedAssemblies @("System.Web.Extensions.dll","System.Drawing.dll")
          if (!(Test-Path "windows-bridge/GeminiControlBridge.exe")) { throw "Build output missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiControlBridge-Windows
          path: |
            windows-bridge/BridgeHost.cs
            windows-bridge/GeminiControlBridge.exe
            windows-bridge/Install-Bridge.ps1
            windows-bridge/SETUP.cmd
            windows-bridge/README.md

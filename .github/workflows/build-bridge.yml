name: Build minimal Windows bridge
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-bridge/**'
      - '.github/workflows/build-bridge.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile .NET Framework executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $refs = @('System.Web.Extensions.dll','System.Drawing.dll','System.Windows.Forms.dll')
          $frameworks = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'),
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\WPF'),
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\WPF')
          )
          foreach ($assembly in @('UIAutomationClient.dll','UIAutomationTypes.dll')) {
            $resolved = $frameworks | ForEach-Object { Join-Path $_ $assembly } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $resolved) { throw "Missing Windows UI Automation assembly: $assembly" }
            $refs += $resolved
          }
          Add-Type -Path @("windows-bridge/BridgeHost.cs","windows-bridge/AccessibleWindows.cs") -OutputAssembly "windows-bridge/GeminiControlBridge.exe" -OutputType ConsoleApplication -ReferencedAssemblies $refs
          if (!(Test-Path "windows-bridge/GeminiControlBridge.exe")) { throw "Build output missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiControlBridge-Windows
          path: |
            windows-bridge/BridgeHost.cs
            windows-bridge/AccessibleWindows.cs
            windows-bridge/GeminiControlBridge.exe
            windows-bridge/Install-Bridge.ps1
            windows-bridge/SETUP.cmd
            windows-bridge/README.md

name: Import source ZIP
on:
  workflow_dispatch:
    inputs:
      archive:
        description: 'ZIP archive committed at repository root'
        required: true
        default: Gemini-Control-Local.zip
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import validated archive
        env:
          ARCHIVE: ${{ inputs.archive }}
        run: |
          python3 - <<'PY'
          import os, zipfile, pathlib, shutil, re, sys
          archive = os.environ["ARCHIVE"]
          if pathlib.PurePosixPath(archive).name != archive or not archive.endswith('.zip'):
              sys.exit("Archive must be a ZIP filename in repository root")
          root = pathlib.Path.cwd()
          f = root / archive
          if not f.is_file(): sys.exit(f"Missing archive: {archive}")
          with zipfile.ZipFile(f) as z:
              info = z.infolist()
              total = sum(e.file_size for e in info)
              if len(info)>500 or total>60*1024*1024: sys.exit("Archive too large")
              for e in info:
                  p = pathlib.PurePosixPath(e.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in e.filename:
                      sys.exit(f"Unsafe archive entry {e.filename}")
                  if e.external_attr >> 16 & 0o170000 == 0o120000:
                      sys.exit(f"Symlinks prohibited: {e.filename}")
                  if any(x in p.parts for x in ('.git','.github','node_modules','__pycache__')):
                      sys.exit(f"Forbidden path: {e.filename}")
                  if p.name == '.env' or (p.name.startswith('.env.') and p.name != '.env.example'):
                      sys.exit(f"Secret file prohibited: {e.filename}")
              z.extractall(root)
          print(f"Unpacked {len(info)} entries, {total} bytes")
          PY
      - name: Scan for common secret patterns
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          issues=[]
          patterns=[rb'gh[pousr]_[A-Za-z0-9_]{20,}',rb'AIza[0-9A-Za-z_-]{25,}',rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----']
          for f in pathlib.Path('.').rglob('*'):
              if not f.is_file() or '.git' in f.parts or f.suffix in ('.png','.jpg','.jpeg','.zip','.ico','.gif','.webp'): continue
              try: data=f.read_bytes()
              except: continue
              if any(re.search(p,data) for p in patterns): issues.append(str(f))
          if issues: sys.exit("Potential secrets in: "+', '.join(issues))
          PY
      - name: Commit imported files
        env:
          ARCHIVE: ${{ inputs.archive }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- "$ARCHIVE"
          if ! git diff --cached --quiet; then
            git commit -m "Import Gemini Control source archive"
            git push
          fi

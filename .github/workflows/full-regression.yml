name: Full Desktop Regression
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/full-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop requirements
        run: python -m pip install -r desktop/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q desktop
      - name: Run all test modules
        shell: pwsh
        run: |
          $tests = Get-ChildItem desktop/tests/test_*.py | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "Testing $($test.Name)"
            python $test.FullName -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

name: Windows Desktop Preview Build
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build requirements
        run: python -m pip install -r desktop/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q desktop
      - name: Test integration and UI contracts
        shell: pwsh
        run: |
          python desktop/tests/test_ui_contract.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/test_voice_recorder.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/test_frozen_plugin_runtime.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/test_scheduled_agent_store.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/test_offline_ai_adapters.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable Windows desktop
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GeminiControlPreview --paths desktop --add-data "desktop/chat_ui.html;." --add-data "desktop/examples;examples" --add-data "desktop/capability_runner.py;." --add-data "desktop/model_worker.py;." --collect-submodules PySide6.QtWebEngineCore --collect-submodules PySide6.QtMultimedia --hidden-import voice_recorder --hidden-import scheduled_agent_store --hidden-import subagent_orchestrator --hidden-import model_runtime --hidden-import model_worker --hidden-import semantic_tools --hidden-import local_image_generation --hidden-import research_discovery desktop/app_openai.py
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist/GeminiControlPreview.exe)) { throw "EXE build failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiControl-Windows-Preview
          path: dist/GeminiControlPreview.exe
          retention-days: 14

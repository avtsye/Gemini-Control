name: Build AI Control Desktop EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt pyinstaller
      - name: Run local desktop tests
        shell: pwsh
        run: |
          python -m compileall -q desktop
          python desktop/tests/test_agent.py -v
          python desktop/tests/test_openai_agent.py -v
          python desktop/tests/test_openai_signin.py -v
          python desktop/tests/test_session_restore.py -v
          python desktop/tests/test_conversations.py -v
          python desktop/tests/test_extensions.py -v
          python desktop/tests/test_ui_contract.py -v
          python desktop/tests/test_generic_computer.py -v
          python desktop/tests/test_windows_state.py -v
          python desktop/tests/test_computer_tools.py -v
          python desktop/tests/test_drawing.py -v
      - name: Package Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIControlDesktop --paths desktop --add-data "desktop/chat_ui.html;." --collect-submodules PySide6.QtWebEngineCore desktop/app_openai.py
          if (!(Test-Path dist/AIControlDesktop.exe)) { throw "EXE missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: AIControlDesktop-Windows
          path: dist/AIControlDesktop.exe

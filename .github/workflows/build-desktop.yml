name: Build AI Control Desktop EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt pyinstaller
      - name: Run local desktop tests
        shell: pwsh
        run: |
          python -m compileall -q desktop
          python desktop/tests/test_agent.py -v
          python desktop/tests/test_openai_agent.py -v
          python desktop/tests/test_openai_signin.py -v
          python desktop/tests/test_session_restore.py -v
          python desktop/tests/test_conversations.py -v
          python desktop/tests/test_extensions.py -v
          python desktop/tests/test_capability_workshop.py -v
          python desktop/tests/test_capability_lifecycle.py -v
          python desktop/tests/test_new_tools.py -v
          python desktop/tests/test_workspace_archives.py -v
          python desktop/tests/test_task_journal.py -v
          python desktop/tests/test_office_tools.py -v
          python desktop/tests/test_workspace_data.py -v
          python desktop/tests/test_dynamic_capabilities.py -v
          python desktop/tests/test_media_examples.py -v
          python desktop/tests/test_ui_contract.py -v
          python desktop/tests/test_generic_computer.py -v
          python desktop/tests/test_windows_state.py -v
          python desktop/tests/test_computer_tools.py -v
          python desktop/tests/test_drawing.py -v
          python desktop/tests/test_pdf_tool.py -v
          python desktop/tests/test_offline_ai_adapters.py -v
          python desktop/tests/test_subagent_orchestrator.py -v
          python desktop/tests/test_scheduled_agent_store.py -v
          python desktop/tests/test_voice_recorder.py -v
      - name: Package Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIControlDesktop --paths desktop --add-data "desktop/chat_ui.html;." --add-data "desktop/examples;examples" --add-data "desktop/capability_runner.py;." --collect-submodules PySide6.QtWebEngineCore --collect-submodules PySide6.QtMultimedia --hidden-import voice_recorder --hidden-import scheduled_agent_store --hidden-import subagent_orchestrator desktop/app_openai.py
          if (!(Test-Path dist/AIControlDesktop.exe)) { throw "EXE missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: AIControlDesktop-Windows
          path: dist/AIControlDesktop.exe

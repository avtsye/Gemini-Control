name: Workspace Tools QA
on:
  push:
    branches: [main]
    paths:
      - 'desktop/workspace_archives.py'
      - 'desktop/agent_core.py'
      - 'desktop/openai_agent.py'
      - 'desktop/task_journal.py'
      - 'desktop/office_tools.py'
      - 'desktop/workspace_data.py'
      - 'desktop/tests/test_workspace_data.py'
      - 'desktop/tests/test_dynamic_capabilities.py'
      - 'desktop/web_shell.py'
      - 'desktop/capability_workshop.py'
      - 'desktop/image_tools.py'
      - 'desktop/ocr_tools.py'
      - 'desktop/speech_tools.py'
      - 'desktop/tests/test_speech_tools.py'
      - 'desktop/file_organizer.py'
      - 'desktop/tests/test_file_organizer.py'
      - 'desktop/tests/test_agent_tool_creation.py'
      - 'desktop/capabilities_catalog.py'
      - 'desktop/tests/test_capabilities_catalog.py'
      - 'desktop/media_tools.py'
      - 'desktop/tests/test_media_tools.py'
      - 'desktop/tests/test_new_tools.py'
      - 'desktop/tests/test_capability_lifecycle.py'
      - 'desktop/tests/test_office_tools.py'
      - 'desktop/requirements.txt'
      - 'desktop/tests/test_task_journal.py'
      - 'desktop/tests/test_workspace_archives.py'
      - '.github/workflows/workspace-tools-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q desktop
      - name: Test workspace ZIP and compare functions
        run: python desktop/tests/test_workspace_archives.py -v
      - name: Install document libraries
        run: python -m pip install openpyxl python-pptx
      - name: Test native file organizer
        run: python desktop/tests/test_file_organizer.py -v
      - name: Test agent capability drafting
        run: python desktop/tests/test_agent_tool_creation.py -v
      - name: Test optional speech tools
        run: python desktop/tests/test_speech_tools.py -v
      - name: Test coverage and optional OCR
        run: python desktop/tests/test_capabilities_catalog.py -v
      - name: Test optional media adapters
        run: python desktop/tests/test_media_tools.py -v
      - name: Test image and capability smoke tests
        run: python desktop/tests/test_new_tools.py -v
      - name: Test capability lifecycle
        run: python desktop/tests/test_capability_lifecycle.py -v
      - name: Test dynamic capabilities
        run: python desktop/tests/test_dynamic_capabilities.py -v
      - name: Test workspace data utilities
        run: python desktop/tests/test_workspace_data.py -v
      - name: Test office generation
        run: python desktop/tests/test_office_tools.py -v
      - name: Test multi-step task journal
        run: python desktop/tests/test_task_journal.py -v

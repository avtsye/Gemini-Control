<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Control</title><style>
:root{color-scheme:light;--bg:#fff;--sidebar:#f9f9f9;--text:#252525;--muted:#777;--border:#e8e8e8;--accent:#181818;--hover:#eeeeee}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,textarea,input,select{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit;border-radius:10px;padding:10px 12px}button:hover{background:var(--hover)}button:disabled{opacity:.4;cursor:default}
.shell{display:flex;height:100vh;overflow:hidden}.side{width:255px;min-width:220px;background:var(--sidebar);padding:18px 12px;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.brand{font-size:20px;font-weight:700;padding:7px 10px 20px}.section{color:#828282;font-size:12px;padding:15px 10px 8px}
.item{text-align:right;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item.active{background:#e9e9e9;font-weight:600}
#chats{overflow-y:auto;flex:1}.side-actions{border-top:1px solid var(--border);padding-top:8px}.main{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{height:58px;display:flex;align-items:center;gap:9px;padding:0 24px;border-bottom:1px solid #f3f3f3}
.toolbar .name{font-weight:600;font-size:16px;margin-left:auto}#state{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px}
select{border:1px solid var(--border);padding:8px;border-radius:9px;max-width:190px;background:white}
.pill{border:1px solid var(--border);padding:8px 13px}.messages{flex:1;overflow-y:auto;padding:30px 25px;scroll-behavior:smooth}
.thread{max-width:760px;margin:auto}.msg{margin:22px 0;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.user{background:#f4f4f4;border-radius:20px;padding:12px 17px;width:fit-content;max-width:85%;margin-right:0;margin-left:auto;direction:rtl}
.msg.assistant{padding:3px 0}.msg.system_note{color:#836b2d;font-size:13px}.label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px}
.welcome{text-align:center;margin:70px auto 30px;font-weight:600;font-size:27px}
.composer-wrap{padding:15px 22px 24px}.composer{max-width:780px;margin:auto;border:1px solid #e1e1e1;border-radius:23px;box-shadow:0 3px 18px #0000000b;background:#fff;padding:13px}
textarea{resize:none;border:0;outline:none;width:100%;min-height:55px;max-height:180px;background:transparent;color:var(--text);line-height:1.6;direction:rtl}
.compose-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.send{border-radius:50%;background:#222;color:white;font-size:18px;width:36px;height:36px;padding:0}.send:hover{background:#444}
.toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}input[type=checkbox]{accent-color:#333}
dialog{border:1px solid var(--border);border-radius:17px;width:min(710px,92vw);max-height:80vh;padding:22px;box-shadow:0 18px 80px #0003}dialog::backdrop{background:#0006}dialog h2{margin-top:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f7f7;padding:13px;border-radius:10px;max-height:260px;overflow:auto}.muted{color:var(--muted)}
@media(max-width:780px){.side{width:180px;min-width:150px}.toolbar{padding:0 8px;flex-wrap:wrap;height:auto;min-height:65px}.toolbar .name{display:none}.messages{padding:12px}.composer-wrap{padding:10px}}
.toast-area{position:fixed;top:18px;left:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:min(420px,90vw);pointer-events:none}.toast{pointer-events:auto;background:#202733;color:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 12px 35px #0003;display:flex;align-items:center;gap:12px;line-height:1.6;border-right:4px solid #6fa1ff}.toast.error{border-right-color:#e76666}.toast.success{border-right-color:#51be87}.toast button{margin-right:auto;color:#fff;padding:3px 8px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.primary-action{background:#232323;color:#fff}.primary-action:hover{background:#454545}
.activity{font-size:12px;color:#687282;display:flex;align-items:center;gap:8px;padding:8px 16px}.activity-dot{width:8px;height:8px;border-radius:50%;background:#8b929d}.activity.running .activity-dot{background:#25a776;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.2;transform:scale(.7)}}.file-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.file-chip{padding:6px 10px;border-radius:10px;background:#edf3fc;color:#2b4e73;font-size:12px}.small-action{padding:7px 10px;border:1px solid #e1e5eb;border-radius:12px}
</style></head><body><div class="shell">
<aside class="side"><div class="brand">AI Control</div><button class="item" id="new">＋ שיחה חדשה</button><div class="section">השיחות שלך</div><div id="chats"></div><div class="side-actions"><button class="item" id="capabilities">✦ סדנת יכולות חדשות</button><button class="item" id="extensions">◈ הרחבות</button><button class="item" id="proposals">◇ הצעות לשיפור</button><button class="item" id="delete">⌫ מחק שיחה</button></div></aside>
<main class="main"><div class="toolbar"><span class="name">AI Control Desktop</span><button class="pill" id="account">החשבון שלי</button><button class="pill" id="login">התחבר ל־ChatGPT</button><select id="models" aria-label="מודל"></select><button class="pill" id="stop">עצור סוכן</button><span id="state">לא מחובר</span></div>
<div class="messages" id="scroll"><div class="thread" id="thread"><div class="welcome">איך אפשר לעזור היום?</div></div></div>
<div class="composer-wrap"><div id="activity" class="activity"><span class="activity-dot"></span><span id="activityText">מוכן לשיחה</span></div><div class="composer"><div id="fileChips" class="file-chips"></div><textarea id="prompt" placeholder="שלח הודעה או בקש לבצע פעולה במחשב…" aria-label="הודעה"></textarea><div class="compose-actions"><button class="small-action" id="attach" title="צרף מסמך" aria-label="צרף מסמך">📎 צרף קובץ</button><label class="toggle"><input type="checkbox" id="agent" checked> מצב סוכן מחשב</label><button class="send" id="send" aria-label="שלח">↑</button></div></div></div></main></div>
<div id="toastArea" class="toast-area" role="status" aria-live="polite"></div><dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">אישור פעולה</h2><p id="confirmText"></p><div class="dialog-actions"><button id="confirmCancel">ביטול</button><button class="primary-action" id="confirmAccept">אישור</button></div></dialog><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button id="close">סגור</button></div></dialog>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script><script>
let bridge=null;let working=false;
const $=id=>document.getElementById(id);
function notify(message,kind='info'){
 const item=document.createElement('div');item.className='toast '+kind;
 const label=document.createElement('span');label.textContent=String(message);item.append(label);
 const close=document.createElement('button');close.textContent='×';close.setAttribute('aria-label','סגור התראה');close.onclick=()=>item.remove();item.append(close);
 $('toastArea').append(item);
 window.setTimeout(()=>item.remove(),7000);
}
function askConfirm(message){return new Promise(resolve=>{
 const dialog=$('confirmDialog');
 $('confirmText').textContent=message;
 function done(answer){dialog.close();resolve(answer)}
 $('confirmCancel').onclick=()=>done(false);
 $('confirmAccept').onclick=()=>done(true);
 dialog.oncancel=e=>{e.preventDefault();done(false)};
 dialog.showModal();
})}
function call(method,...args){return new Promise((resolve,reject)=>{if(!bridge)return reject(Error("החיבור למחשב אינו זמין"));bridge[method](...args,r=>{try{if(typeof r!=='string'||!r.trim())throw Error('הפעולה לא החזירה תשובה. נסה לעדכן את התוכנה.');const data=JSON.parse(r);if(data.error)reject(Error(data.error));else resolve(data)}catch(e){reject(e)}})})}
function status(value){$('state').textContent=value}
function activity(value,running=false){$('activityText').textContent=value;$('activity').classList.toggle('running',running)}
function addMessage(role,text){const thread=$('thread');thread.querySelector('.welcome')?.remove();const item=document.createElement('div');item.className='msg '+role;const label=document.createElement('div');label.className='label';label.textContent=role==='user'?'אתה':role==='assistant'?'ChatGPT':'מערכת';item.append(label,document.createTextNode(text));thread.append(item);$('scroll').scrollTop=$('scroll').scrollHeight}
async function loadChats(){const data=await call('chats');const box=$('chats');box.replaceChildren();for(const chat of data.items){const b=document.createElement('button');b.className='item'+(chat.id===data.active?' active':'');b.textContent=chat.title;b.onclick=()=>call('select_chat',chat.id).then(showChat).catch(e=>status(e.message));box.append(b)}}
function showChat(data){$('thread').replaceChildren();if(data.messages.length){for(const m of data.messages)addMessage(m.role,m.content)}else{const h=document.createElement('div');h.className='welcome';h.textContent='איך אפשר לעזור היום?';$('thread').append(h)}loadChats()}
function modal(title){$('modalTitle').textContent=title;$('modalBody').replaceChildren();if(!$('modal').open)$('modal').showModal();return $('modalBody')}
function element(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
async function capabilityWorkshop(){
 const body=modal('סדנת פיתוח יכולות');
 element('p','בנה יכולת חדשה בקוד Python, כולל יצירת שמע וקובצי מדיה. קוד חדש נשמר כטיוטה ולא מופעל אוטומטית.',body);
 const description=document.createElement('textarea');description.placeholder='למשל: צור קובץ WAV של מנגינה לפי תווים ותדרים';description.style.border='1px solid #bbb';body.append(description);
 const create=element('button','צור קוד הרחבה לבדיקה',body);
 create.onclick=()=>call('generate_capability',description.value,$('models').value).then(()=>notify('יוצר טיוטת יכולת…')).catch(e=>notify(e.message,'error'));
 element('h3','דוגמאות מוכנות',body);
 for(const [kind,name] of [['audio','צור טיוטת מחולל שמע WAV'],['video','צור טיוטת אנימציית GIF']]){
  const sample=element('button',name,body);
  sample.onclick=()=>call('example_capability',kind).then(d=>inspectCapability(d.id)).catch(e=>notify(e.message,'error'));
 }
 const data=await call('capabilities');
 for(const item of data.items){
   element('h3',item.name+' ('+item.status+')',body);
   element('p',item.description||'',body);
   const inspect=element('button','בדוק את קוד ההרחבה',body);
   inspect.onclick=()=>inspectCapability(item.id);
   if(item.status==='enabled'){
     const run=element('button','הרץ עם אישור',body);
     run.onclick=async()=>{const payload='{}';try{await call('run_capability',item.id,payload);notify('הרחבה התחילה לרוץ','success')}catch(e){notify(e.message,'error')}};
     const disable=element('button','השבת',body);
     disable.onclick=()=>call('disable_capability',item.id).then(capabilityWorkshop).catch(e=>notify(e.message,'error'));
   }
 }
}
function promptPayload(){
 const raw=$('capabilityPayload').value.trim();try{JSON.parse(raw);return raw}catch(e){notify('קלט JSON אינו תקין','error');return null}
}
async function inspectCapability(id){
 const info=await call('inspect_capability',id);
 const body=modal('בדיקת קוד הרחבה');
 element('p','זהו קוד Python אמיתי, לא סביבת Sandbox אבטחתית. יש לקרוא את הקוד לפני הפעלה.',body);
 for(const warning of info.findings)element('p',warning,body);
 element('pre',info.source,body);
 const label=element('label','קלט JSON לבדיקה ולהרצה',body);
 const input=document.createElement('textarea');input.id='capabilityPayload';input.value='{}';input.style.border='1px solid #aaa';body.append(input);
 if(info.status!=='enabled'){
   const test=element('button','בדוק פונקציה עם הקלט',body);
   test.onclick=async()=>{try{const payload=JSON.parse(input.value);if(!payload||Array.isArray(payload)||typeof payload!=='object')throw Error('נדרש אובייקט JSON');await call('test_capability',id,JSON.stringify(payload));notify('בדיקת פונקציה התחילה; תוצאות יופיעו בצאט','success')}catch(e){notify(e.message,'error')}};
   const enable=element('button','אשר והפעל לשימוש הסוכן',body);
   enable.onclick=async()=>{if(await askConfirm('להפעיל כלי Python זה? נדרשת בדיקת ניסיון מוצלחת בכלי חדש; הקוד אינו מבודד כברירת מחדל.'))try{await call('enable_capability',id,true);notify('היכולת הופעלה ותוצג לסוכן בשיחה הבאה','success');await capabilityWorkshop()}catch(e){notify(e.message,'error')}};
 }else{
   const run=element('button','הרץ כלי עם הקלט',body);
   run.onclick=async()=>{try{await call('run_capability',id,JSON.stringify(JSON.parse(input.value)));notify('ההרצה התחילה','success')}catch(e){notify(e.message,'error')}};
 }
}
async function proposals(){const data=await call('proposals');const body=modal('הצעות לשיפור הסוכן');if(!data.items.length)element('p','אין כרגע הצעות.',body);for(const p of data.items){element('h3',p.description+' ('+p.status+')',body);element('pre',p.steps,body);if(p.status==='pending'){for(const [s,title] of [['approved','סמן כנבדק'],['rejected','דחה']]){const b=element('button',title,body);b.onclick=()=>call('review_proposal',p.id,s).then(proposals)}}if(p.status==='approved'){const b=element('button','בנה הרחבה מההצעה',body);b.onclick=()=>call('build_extension',p.id,$('models').value).then(()=>notify('מכין הרחבה לבדיקה…')).catch(e=>notify(e.message,'error'))}}}
async function extensions(){const data=await call('extensions');const body=modal('מערכת הרחבות');element('p','הרחבות הן רצפים מוגבלים של כלים קיימים. הן אינן מריצות קוד חיצוני.',body);for(const x of data.items){const p=element('div',x.name+' — '+x.status+' · '+x.steps.length+' צעדים',body);p.style.padding='8px';const enable=element('button',x.status==='enabled'?'השבת':'הפעל',body);enable.onclick=()=>call('toggle_extension',x.id,x.status!=='enabled').then(extensions);if(x.status==='enabled'){const run=element('button','הרץ באישור',body);run.onclick=()=>call('run_extension',x.id).then(v=>notify(v.message,'success')).catch(e=>notify(e.message,'error'))}}element('h3','הוסף הרחבה (JSON מאומת)',body);const input=document.createElement('textarea');input.style.border='1px solid #ccc';input.style.height='130px';input.placeholder='{"name":"בדיקת חלונות","steps":[{"tool":"windows_snapshot","arguments":{}}]}';body.append(input);const install=element('button','בדוק והוסף מושבתת',body);install.onclick=()=>call('install_extension',input.value).then(extensions).catch(e=>notify(e.message,'error'))}
$('close').onclick=()=>$('modal').close();
$('new').onclick=()=>call('new_chat').then(showChat).catch(e=>status(e.message));
$('delete').onclick=async()=>{if(await askConfirm('למחוק את השיחה המקומית ואת כל ההודעות שבה?'))call('delete_chat').then(showChat).catch(e=>notify(e.message,'error'))};
$('extensions').onclick=()=>extensions().catch(e=>notify(e.message,'error'));
$('capabilities').onclick=()=>capabilityWorkshop().catch(e=>notify(e.message,'error'));
$('proposals').onclick=()=>proposals().catch(e=>notify(e.message,'error'));
$('login').onclick=()=>{activity('פותח התחברות…',true);call('login').catch(e=>{status(e.message);activity('התחברות נכשלה')})};
$('account').onclick=async()=>{try{const a=await call('account_details');const body=modal('החשבון והנתונים שלי');element('p',a.connected?'מחובר ל־ChatGPT':'לא מחובר',body);element('p','כתובת חשבון: '+a.email,body);element('p','מספר מודלים זמינים: '+a.model_count,body);element('p','מודלים: '+(a.models.join(', ')||'לא זמין'),body);element('p','נתוני שימוש: '+a.usage,body);element('p','מסד השיחות: '+a.history_path,body);element('p','יכולות מותקנות: '+a.capability_count,body)}catch(e){notify(e.message,'error')}};
$('attach').onclick=async()=>{activity('בוחר ומעבד קובץ…',true);try{const a=await call('pick_attachment');if(a.cancelled){activity('מוכן לשיחה');return}const chip=element('span','📄 '+a.name+' · '+a.characters+' תווים',$('fileChips'));chip.className='file-chip';activity('קובץ מוכן לשליחה · המידע לא הועבר עדיין למודל');}catch(e){notify(e.message,'error');activity('קריאת הקובץ נכשלה')}};

$('stop').onclick=()=>call('toggle_agent').then(x=>status(x.message));
$('send').onclick=send;
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
async function send(){
if(working)return;
const text=$('prompt').value.trim();
if(!text)return;
if(!$('models').value){status('יש להתחבר ולבחור מודל לפני השליחה');return}
working=true;$('send').disabled=true;activity('שולח למודל…',true);
try{
  await call('send',text,$('models').value,$('agent').checked);
  $('prompt').value='';$('fileChips').replaceChildren();
  addMessage('user',text);
  if(working){status('הסוכן עובד…');activity('הסוכן מתכנן ומבצע שלבים…',true)}
}catch(e){
  status('שליחה נכשלה: '+e.message);activity('שליחה נכשלה');
  working=false;$('send').disabled=false;
}}
function updateModels(models){const select=$('models');select.replaceChildren();for(const m of models){const o=document.createElement('option');o.value=m[0];o.textContent=m[1];select.append(o)}}
if(!window.qt||!qt.webChannelTransport){status('גשר Windows אינו זמין. בדוק את התקנת Qt WebEngine.')}else new QWebChannel(qt.webChannelTransport,channel=>{bridge=channel.objects.api;bridge.event.connect(raw=>{const msg=JSON.parse(raw);if(msg.type==='extension_draft'){
 if(msg.capability_id){notify('טיוטת קוד חדשה נוצרה: '+msg.name,'success');inspectCapability(msg.capability_id).catch(e=>notify(e.message,'error'))}
 if(msg.error){notify(msg.error,'error');}
 else if(msg.manifest){
  const preview=JSON.stringify(msg.manifest,null,2);
  const panel=modal('הרחבה מוכנה לבדיקה');
  element('p','בדוק את רצף הכלים. ההרחבה תותקן כמושבתת ולא תופעל אוטומטית.',panel);
  element('pre',preview,panel);
  const install=element('button','התקן הרחבה מושבתת',panel);
  install.className='primary-action';
  install.onclick=async()=>{if(await askConfirm('להתקין את ההרחבה במצב מושבת, בלי להריץ אותה?')){
    try{await call('install_extension',JSON.stringify(msg.manifest));notify('ההרחבה הותקנה כמושבתת','success');extensions()}
    catch(e){notify(e.message,'error')}
  }};
 }
}if(msg.type==='approval'){activity('ממתין לאישור פעולה…',true);askConfirm(msg.description).then(ok=>call('approval_reply',ok).catch(e=>notify(e.message,'error')))}if(msg.type==='message')addMessage(msg.role,msg.text);if(msg.type==='models'){updateModels(msg.models);status(msg.status)}if(msg.type==='status'){status(msg.text);activity(msg.text,false)}if(msg.type==='finished'){working=false;$('send').disabled=false;activity('הפעולה הסתיימה');loadChats()}});call('session').then(d=>{updateModels(d.models);status(d.status)});call('chats').then(d=>call('select_chat',d.active).then(showChat));});
</script></body></html>

<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Control</title><style>
:root{color-scheme:light;--bg:#fff;--sidebar:#f9f9f9;--text:#252525;--muted:#777;--border:#e8e8e8;--accent:#181818;--hover:#eeeeee}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,textarea,input,select{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit;border-radius:10px;padding:10px 12px}button:hover{background:var(--hover)}button:disabled{opacity:.4;cursor:default}
.shell{display:flex;height:100vh;overflow:hidden}.side{width:255px;min-width:220px;background:var(--sidebar);padding:18px 12px;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.brand{font-size:20px;font-weight:700;padding:7px 10px 20px}.section{color:#828282;font-size:12px;padding:15px 10px 8px}
.item{text-align:right;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item.active{background:#e9e9e9;font-weight:600}
#chats{overflow-y:auto;flex:1}.side-actions{border-top:1px solid var(--border);padding-top:8px}.main{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{height:58px;display:flex;align-items:center;gap:9px;padding:0 24px;border-bottom:1px solid #f3f3f3}
.toolbar .name{font-weight:600;font-size:16px;margin-left:auto}#state{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px}
select{border:1px solid var(--border);padding:8px;border-radius:9px;max-width:190px;background:white}
.pill{border:1px solid var(--border);padding:8px 13px}.messages{flex:1;overflow-y:auto;padding:30px 25px;scroll-behavior:smooth}
.thread{max-width:760px;margin:auto}.msg{margin:22px 0;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msg.user{background:#f4f4f4;border-radius:20px;padding:12px 17px;width:fit-content;max-width:85%;margin-right:0;margin-left:auto;direction:rtl}
.msg.assistant{padding:3px 0}.msg.system_note{color:#836b2d;font-size:13px}.label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px}
.welcome{text-align:center;margin:70px auto 30px;font-weight:600;font-size:27px}
.composer-wrap{padding:15px 22px 24px}.composer{max-width:780px;margin:auto;border:1px solid #e1e1e1;border-radius:23px;box-shadow:0 3px 18px #0000000b;background:#fff;padding:13px}
textarea{resize:none;border:0;outline:none;width:100%;min-height:55px;max-height:180px;background:transparent;color:var(--text);line-height:1.6;direction:rtl}
.compose-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.send{border-radius:50%;background:#222;color:white;font-size:18px;width:36px;height:36px;padding:0}.send:hover{background:#444}
.toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}input[type=checkbox]{accent-color:#333}
dialog{border:1px solid var(--border);border-radius:17px;width:min(710px,92vw);max-height:80vh;padding:22px;box-shadow:0 18px 80px #0003}dialog::backdrop{background:#0006}dialog h2{margin-top:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f7f7;padding:13px;border-radius:10px;max-height:260px;overflow:auto}.muted{color:var(--muted)}
@media(max-width:780px){.side{width:180px;min-width:150px}.toolbar{padding:0 8px;flex-wrap:wrap;height:auto;min-height:65px}.toolbar .name{display:none}.messages{padding:12px}.composer-wrap{padding:10px}}
.toast-area{position:fixed;top:18px;left:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:min(420px,90vw);pointer-events:none}.toast{pointer-events:auto;background:#202733;color:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 12px 35px #0003;display:flex;align-items:center;gap:12px;line-height:1.6;border-right:4px solid #6fa1ff}.toast.error{border-right-color:#e76666}.toast.success{border-right-color:#51be87}.toast button{margin-right:auto;color:#fff;padding:3px 8px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.primary-action{background:#232323;color:#fff}.primary-action:hover{background:#454545}
.activity{font-size:12px;color:#687282;display:flex;align-items:center;gap:8px;padding:8px 16px}.activity-dot{width:8px;height:8px;border-radius:50%;background:#8b929d}.activity.running .activity-dot{background:#25a776;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.2;transform:scale(.7)}}.file-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.file-chip{padding:6px 10px;border-radius:10px;background:#edf3fc;color:#2b4e73;font-size:12px}.small-action{padding:7px 10px;border:1px solid #e1e5eb;border-radius:12px}.composer.drop-target{outline:3px dashed #578aca;background:#edf6ff}
.chat-row{display:flex;gap:3px;align-items:center}.chat-row>.item{flex:1;min-width:0}.chat-row>.small-action{flex:none;padding:4px 8px}#chatSearch{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px;margin:4px 0 8px;background:var(--bg);color:var(--text)}
.code-block{border:1px solid var(--border);border-radius:12px;margin:10px 0;overflow:hidden}.code-block pre{margin:0;max-height:420px;white-space:pre;overflow:auto;border-radius:0}.code-header{background:var(--sidebar);padding:5px 12px;display:flex;align-items:center;gap:8px}.code-header button{font-size:12px;border:1px solid var(--border);padding:5px 9px}.md-table{border-collapse:collapse;width:100%;margin:10px 0}.md-table td,.md-table th{border:1px solid var(--border);padding:7px;text-align:right}.markdown-heading{font-weight:700;font-size:1.12rem;margin-top:10px}.artifact-panel{width:min(42vw,540px);border-right:1px solid var(--border);background:var(--bg);overflow:auto;padding:12px}.artifact-panel[hidden]{display:none}.artifact-heading{display:flex;justify-content:space-between;align-items:center}.artifact-panel iframe{width:100%;height:70vh;border:1px solid var(--border)}@media(max-width:860px){.artifact-panel{position:fixed;z-index:20;inset:0 30% 0 0;width:70%;box-shadow:0 0 15px #0002}}
body.theme-dark{color-scheme:dark;--bg:#171b22;--sidebar:#1f2630;--text:#e6eaf0;--muted:#a0aab7;--border:#344154;--hover:#2c3544;--accent:#8cbaff}body.theme-dark .composer,body.theme-dark select{background:#222b37;color:var(--text)}body.theme-dark .msg,body.theme-dark dialog{background:var(--bg);color:var(--text)}body.theme-dark pre{background:#283442;color:#e7ecf6}body.theme-dark .item.active{background:#34455b}body.theme-dark .pill,body.theme-dark .small-action{border-color:var(--border)}
.permission-row{display:flex;gap:8px;align-items:center;padding:6px 3px;border-bottom:1px solid var(--border)}.permission-row[hidden]{display:none}
.activity-entry{padding:8px;border-bottom:1px solid var(--border);line-height:1.6}
</style></head><body><div class="shell">
<aside class="side"><div class="brand">AI Control</div><button class="item" id="new">＋ שיחה חדשה</button><div class="section">השיחות שלך</div><input id="chatSearch" placeholder="חיפוש בכל השיחות..." aria-label="חיפוש בשיחות"><button class="item" id="backupChats">↓ גיבוי שיחות ל־JSON</button><button class="item" id="restoreChats">↑ שחזור שיחות מגיבוי</button><div id="chats"></div><div class="side-actions"><button class="item" id="toolsCatalog">☷ כלים זמינים לסוכן</button><button class="item" id="toolSecurity">♧ הרשאות כלים</button><button class="item" id="reminders">◷ תזכורות מתוזמנות</button><button class="item" id="capabilities">✦ סדנת יכולות חדשות</button><button class="item" id="extensions">◈ הרחבות</button><button class="item" id="proposals">◇ הצעות לשיפור</button><button class="item" id="delete">⌫ מחק שיחה</button></div></aside>
<main class="main"><div class="toolbar"><span class="name">AI Control Desktop</span><button class="pill" id="uiPrefs">⚙ מראה</button><button class="pill" id="account">החשבון שלי</button><button class="pill" id="login">התחבר ל־ChatGPT</button><select id="models" aria-label="מודל"></select><button class="pill" id="compareModels">⇄ השווה מודלים</button><button class="pill" id="agentActivity">☷ פעילות הסוכן</button><button class="pill" id="stop">עצור סוכן</button><span id="state">לא מחובר</span></div>
<div class="messages" id="scroll"><div class="thread" id="thread"><div class="welcome">איך אפשר לעזור היום?</div></div></div>
<div class="composer-wrap"><div id="activity" class="activity"><span class="activity-dot"></span><span id="activityText">מוכן לשיחה</span></div><div class="composer"><div id="fileChips" class="file-chips"></div><textarea id="prompt" placeholder="שלח הודעה או בקש לבצע פעולה במחשב…" aria-label="הודעה"></textarea><div class="compose-actions"><button class="small-action" id="attach" title="צרף מסמך" aria-label="צרף מסמך">📎 צרף קובץ</button><label class="toggle"><input type="checkbox" id="agent" checked> מצב סוכן מחשב</label><button class="send" id="send" aria-label="שלח">↑</button></div></div></div></main><aside id="artifactPanel" class="artifact-panel" hidden><div class="artifact-heading"><strong id="artifactTitle">תצוגת תוצר</strong><button id="closeArtifact" aria-label="סגור תצוגה">×</button></div><div id="artifactContent"></div></aside></div>
<div id="toastArea" class="toast-area" role="status" aria-live="polite"></div><dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">אישור פעולה</h2><p id="confirmText"></p><div class="dialog-actions"><button id="confirmCancel">ביטול</button><button class="primary-action" id="confirmAccept">אישור</button></div></dialog><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button id="close">סגור</button></div></dialog>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script><script>
let bridge=null;let working=false;const activityHistory=[];
const $=id=>document.getElementById(id);
$('closeArtifact').onclick=()=>$('artifactPanel').hidden=true;
function notify(message,kind='info'){
 const item=document.createElement('div');item.className='toast '+kind;
 const label=document.createElement('span');label.textContent=String(message);item.append(label);
 const close=document.createElement('button');close.textContent='×';close.setAttribute('aria-label','סגור התראה');close.onclick=()=>item.remove();item.append(close);
 $('toastArea').append(item);
 window.setTimeout(()=>item.remove(),7000);
}
const ALLOWED_DROPPED_EXT=/\\.(txt|md|json|csv|py|js|html|css)$/i;
const composer=document.querySelector('.composer');
composer.addEventListener('dragover',event=>{event.preventDefault();composer.classList.add('drop-target')});
composer.addEventListener('dragleave',()=>composer.classList.remove('drop-target'));
composer.addEventListener('drop',async event=>{
 event.preventDefault();composer.classList.remove('drop-target');
 const files=Array.from(event.dataTransfer?.files||[]).slice(0,12);
 for(const file of files){
  if(!ALLOWED_DROPPED_EXT.test(file.name)||file.size>1000000){notify('גרירה אינה תומכת בקובץ '+file.name,'error');continue}
  try{
   const text=await file.text();
   const result=await call('attach_text',file.name,text);
   const chip=element('button','📄 '+result.name,$('fileChips'));
   chip.className='file-chip';chip.title='לחץ לתצוגה מקדימה';
   chip.onclick=()=>{const panel=modal('תצוגה מקדימה: '+result.name);element('pre',text.slice(0,8000),panel)};
  }catch(error){notify(error.message,'error')}
 }
});
function askConfirm(message){return new Promise(resolve=>{
 const dialog=$('confirmDialog');
 $('confirmText').textContent=message;
 function done(answer){dialog.close();resolve(answer)}
 $('confirmCancel').onclick=()=>done(false);
 $('confirmAccept').onclick=()=>done(true);
 dialog.oncancel=e=>{e.preventDefault();done(false)};
 dialog.showModal();
})}
function call(method,...args){return new Promise((resolve,reject)=>{if(!bridge)return reject(Error("החיבור למחשב אינו זמין"));bridge[method](...args,r=>{try{if(typeof r!=='string'||!r.trim())throw Error('הפעולה לא החזירה תשובה. נסה לעדכן את התוכנה.');const data=JSON.parse(r);if(data.error)reject(Error(data.error));else resolve(data)}catch(e){reject(e)}})})}
function status(value){$('state').textContent=value}
function activity(value,running=false){$('activityText').textContent=value;$('activity').classList.toggle('running',running)}
function renderMarkdown(target,source){
 const lines=String(source).split('\n');
 let i=0;
 while(i<lines.length){
  const line=lines[i];
  if(/^\x60\x60\x60/.test(line)){
   const language=line.slice(3).trim().toLowerCase();const content=[];
   i++;while(i<lines.length&&!/^\x60\x60\x60/.test(lines[i]))content.push(lines[i++]);
   if(i<lines.length)i++;
   const wrapper=element('div','',target);wrapper.className='code-block';
   const header=element('div',language||'קוד',wrapper);header.className='code-header';
   const copy=element('button','העתק קוד',header);
   copy.onclick=()=>navigator.clipboard.writeText(content.join('\n')).then(()=>notify('הקוד הועתק','success')).catch(()=>notify('ההעתקה נכשלה','error'));
   if(['html','htm'].includes(language)){
    const preview=element('button','תצוגת HTML',header);
    preview.onclick=()=>showArtifact('תצוגת HTML',content.join('\n'),'html');
   }
   const pre=element('pre','',wrapper);const code=element('code',content.join('\n'),pre);code.dir='ltr';
   continue;
  }
  if(line.includes('|')&&i+1<lines.length&&/^\s*\|?[-:| ]+\|?\s*$/.test(lines[i+1])){
   const table=element('table','',target);table.className='md-table';
   const parse=row=>row.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
   const heads=parse(line);const tr=element('tr','',table);
   heads.forEach(x=>element('th',x,tr));i+=2;
   while(i<lines.length&&lines[i].includes('|')){const row=element('tr','',table);parse(lines[i++]).forEach(x=>element('td',x,row))}
   continue;
  }
  const p=element('div',line||' ',target);
  p.className='markdown-line';
  if(/^#{1,4} /.test(line)){p.classList.add('markdown-heading');p.textContent=line.replace(/^#{1,4} /,'')}
  i++;
 }
}
function showArtifact(title,content,type='text'){
 const panel=$('artifactPanel');panel.hidden=false;
 $('artifactTitle').textContent=title;
 const contentBox=$('artifactContent');contentBox.replaceChildren();
 if(type==='html'){
  const frame=document.createElement('iframe');frame.setAttribute('sandbox','');
  frame.setAttribute('referrerpolicy','no-referrer');
  frame.srcdoc='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:">'+content;
  contentBox.append(frame);
 }else{const pre=element('pre',content,contentBox);pre.dir='auto'}
}
function addMessage(role,text,index=null){
 const thread=$('thread');thread.querySelector('.welcome')?.remove();
 const item=document.createElement('div');item.className='msg '+role;
 const label=document.createElement('div');label.className='label';label.textContent=role==='user'?'אתה':role==='assistant'?'ChatGPT':'מערכת';
 const content=document.createElement('div');renderMarkdown(content,text);item.append(label,content);
 if(role==='assistant'&&Number.isInteger(index)){
  const another=element('button','↻ גרסה נוספת',item);another.className='small-action';
  another.onclick=async()=>{
   if(!$('models').value){notify('יש לבחור מודל קודם','error');return}
   try{await call('regenerate_answer',index,$('models').value);activity('יוצר גרסה נוספת…',true)}
   catch(e){notify(e.message,'error')}
  };
 }
 if(role==='user'&&Number.isInteger(index)){
  const edit=element('button','✎ ערוך הודעה',item);edit.className='small-action';
  edit.onclick=async()=>{
   const newText=window.prompt('ערוך הודעה (התשובות שאחריה יוסרו מהשיחה):',text);
   if(newText===null||!newText.trim())return;
   if(!await askConfirm('עריכת ההודעה תסיר את התשובות וההודעות המאוחרות יותר. להמשיך?'))return;
   try{await call('edit_message',index,newText);await call('select_chat',(await call('chats')).active).then(showChat);$('prompt').value=newText;notify('ההודעה נערכה. אפשר לשלוח מחדש.','success')}catch(e){notify(e.message,'error')}
  };
 }
 thread.append(item);$('scroll').scrollTop=$('scroll').scrollHeight
}
async function loadChats(){
 const data=await call('chats');const box=$('chats');box.replaceChildren();
 for(const chat of data.items){
  if(chat.archived)continue;
  const row=document.createElement('div');row.className='chat-row';
  const b=element('button',(chat.pinned?'📌 ':'')+(chat.project?'['+chat.project+'] ':'')+chat.title,row);
  b.className='item'+(chat.id===data.active?' active':'');
  b.onclick=()=>call('select_chat',chat.id).then(showChat).catch(e=>status(e.message));
  const menu=element('button','⋯',row);menu.title='ניהול שיחה';menu.className='small-action';
  menu.onclick=()=>chatActions(chat.id,chat.title,chat.pinned,chat.archived);
  box.append(row);
 }
 const archived=data.items.filter(x=>x.archived);
 if(archived.length){const show=element('button','ארכיון ('+archived.length+')',box);show.className='item';show.onclick=()=>{
   for(const chat of archived){const b=element('button',chat.title,box);b.className='item';b.onclick=()=>call('select_chat',chat.id).then(showChat)}
   show.remove();
  }}
}
async function searchConversations(){
 const query=$('chatSearch').value.trim();
 if(!query){loadChats();return}
 const data=await call('search_chats',query);
 $('chats').replaceChildren();
 for(const result of data.items){
  const b=element('button',result.title+' — '+result.snippet,$('chats'));
  b.className='item';b.title=result.snippet;
  b.onclick=()=>call('select_chat',result.id).then(showChat).catch(e=>notify(e.message,'error'));
 }
 if(!data.items.length)element('p','לא נמצאו הודעות מתאימות',$('chats'));
}
$('chatSearch').addEventListener('input',()=>searchConversations().catch(e=>notify(e.message,'error')));
$('restoreChats').onclick=async()=>{
 if(!await askConfirm('לייבא שיחות מגיבוי JSON? השיחות הקיימות לא יימחקו.'))return;
 try{const result=await call('restore_chats');if(!result.cancelled){notify('שוחזרו '+result.restored_chats+' שיחות','success');loadChats()}}catch(e){notify(e.message,'error')}
};
$('backupChats').onclick=()=>call('backup_chats').then(result=>{if(result.saved)notify('הגיבוי נשמר: '+result.saved,'success')}).catch(e=>notify(e.message,'error'));
async function chatActions(id,title,pinned,archived){
 const body=modal('ניהול שיחה: '+title);
 for(const [field,value,label] of [['pinned',!pinned,pinned?'הסר נעיצה':'נעץ שיחה'],['archived',!archived,archived?'החזר מארכיון':'העבר לארכיון']]){
  const button=element('button',label,body);
  button.onclick=()=>call('set_chat_property',id,field,String(value)).then(()=>{loadChats();notify('עודכן','success')}).catch(e=>notify(e.message,'error'));
 }
 const tag=document.createElement('input');tag.placeholder='שם פרויקט או תיקייה';tag.maxLength=80;body.append(tag);
 const save=element('button','שייך לפרויקט',body);save.onclick=()=>call('set_chat_property',id,'project',tag.value).then(loadChats).catch(e=>notify(e.message,'error'));
}
function showChat(data){$('thread').replaceChildren();if(data.messages.length){for(const [i,m] of data.messages.entries())addMessage(m.role,m.content,i)}else{const h=document.createElement('div');h.className='welcome';h.textContent='איך אפשר לעזור היום?';$('thread').append(h)}loadChats()}
function modal(title){$('modalTitle').textContent=title;$('modalBody').replaceChildren();if(!$('modal').open)$('modal').showModal();return $('modalBody')}
function element(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
async function capabilityWorkshop(){
 const body=modal('סדנת פיתוח יכולות');
 element('p','בנה יכולת חדשה בקוד Python, כולל יצירת שמע וקובצי מדיה. קוד חדש נשמר כטיוטה ולא מופעל אוטומטית.',body);
 const description=document.createElement('textarea');description.placeholder='למשל: צור קובץ WAV של מנגינה לפי תווים ותדרים';description.style.border='1px solid #bbb';body.append(description);
 const create=element('button','צור קוד הרחבה לבדיקה',body);
 create.onclick=()=>call('generate_capability',description.value,$('models').value).then(()=>notify('יוצר טיוטת יכולת…')).catch(e=>notify(e.message,'error'));
 element('h3','דוגמאות מוכנות',body);
 for(const [kind,name] of [['audio','צור טיוטת מחולל שמע WAV'],['video','צור טיוטת אנימציית GIF']]){
  const sample=element('button',name,body);
  sample.onclick=()=>call('example_capability',kind).then(d=>inspectCapability(d.id)).catch(e=>notify(e.message,'error'));
 }
 const data=await call('capabilities');
 for(const item of data.items){
   element('h3',item.name+' ('+item.status+')',body);
   element('p',item.description||'',body);
   const inspect=element('button','בדוק את קוד ההרחבה',body);
   inspect.onclick=()=>inspectCapability(item.id);
   if(item.status==='enabled'){
     const run=element('button','הרץ עם אישור',body);
     run.onclick=async()=>{const payload='{}';try{await call('run_capability',item.id,payload);notify('הרחבה התחילה לרוץ','success')}catch(e){notify(e.message,'error')}};
     const disable=element('button','השבת',body);
     disable.onclick=()=>call('disable_capability',item.id).then(capabilityWorkshop).catch(e=>notify(e.message,'error'));
   }
 }
}
function promptPayload(){

window.addEventListener('keydown',event=>{

async function send(){
if(working)return;
const text=$('prompt').value.trim();
if(!text)return;
if(!$('models').value){status('יש להתחבר ולבחור מודל לפני השליחה');return}
working=true;activityHistory.length=0;$('send').disabled=true;activity('שולח למודל…',true);
try{
  await call('send',text,$('models').value,$('agent').checked);
  $('prompt').value='';$('fileChips').replaceChildren();
  addMessage('user',text);
  if(working){status('הסוכן עובד…');activity('הסוכן מתכנן ומבצע שלבים…',true)}
}catch(e){
  status('שליחה נכשלה: '+e.message);activity('שליחה נכשלה');
  working=false;$('send').disabled=false;
}}
function updateModels(models){const select=$('models');select.replaceChildren();for(const m of models){const o=document.createElement('option');o.value=m[0];o.textContent=m[1];select.append(o)}}
if(!window.qt||!qt.webChannelTransport){status('גשר Windows אינו זמין. בדוק את התקנת Qt WebEngine.')}else new QWebChannel(qt.webChannelTransport,channel=>{bridge=channel.objects.api;bridge.event.connect(raw=>{const msg=JSON.parse(raw);if(msg.type==='extension_draft'){
 if(msg.capability_id){notify('טיוטת קוד חדשה נוצרה: '+msg.name,'success');inspectCapability(msg.capability_id).catch(e=>notify(e.message,'error'))}
 if(msg.error){notify(msg.error,'error');}
 else if(msg.manifest){
  const preview=JSON.stringify(msg.manifest,null,2);
  const panel=modal('הרחבה מוכנה לבדיקה');
  element('p','בדוק את רצף הכלים. ההרחבה תותקן כמושבתת ולא תופעל אוטומטית.',panel);
  element('pre',preview,panel);
  const install=element('button','התקן הרחבה מושבתת',panel);
  install.className='primary-action';
  install.onclick=async()=>{if(await askConfirm('להתקין את ההרחבה במצב מושבת, בלי להריץ אותה?')){
    try{await call('install_extension',JSON.stringify(msg.manifest));notify('ההרחבה הותקנה כמושבתת','success');extensions()}
    catch(e){notify(e.message,'error')}
  }};
 }
}if(msg.type==='reminder'){notify('⏰ תזכורת: '+msg.title,'success');activity('תזכורת: '+msg.title,false)}if(msg.type==='approval'){activity('ממתין לאישור פעולה…',true);askConfirm(msg.description).then(ok=>call('approval_reply',ok).catch(e=>notify(e.message,'error')))}if(msg.type==='activity'){activityHistory.push(String(msg.text||'').slice(0,250));if(activityHistory.length>100)activityHistory.shift();activity(msg.text,true)}if(msg.type==='message')addMessage(msg.role,msg.text);if(msg.type==='models'){updateModels(msg.models);status(msg.status)}if(msg.type==='status'){status(msg.text);activity(msg.text,false)}if(msg.type==='finished'){working=false;$('send').disabled=false;activity('הפעולה הסתיימה');loadChats()}});call('session').then(d=>{updateModels(d.models);status(d.status)});call('chats').then(d=>call('select_chat',d.active).then(showChat));});
</script></body></html>

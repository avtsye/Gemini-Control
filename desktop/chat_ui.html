<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Control</title><style>
:root{color-scheme:light;--bg:#fff;--sidebar:#f9f9f9;--text:#252525;--muted:#777;--border:#e8e8e8;--accent:#181818;--hover:#eeeeee}

.msg.user{background:#f4f4f4;border-radius:20px;padding:12px 17px;width:fit-content;max-width:85%;margin-right:0;margin-left:auto;direction:rtl}
.msg.assistant{padding:3px 0}.msg.system_note{color:#836b2d;font-size:13px}.label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px}

textarea{resize:none;border:0;outline:none;width:100%;min-height:55px;max-height:180px;background:transparent;color:var(--text);line-height:1.6;direction:rtl}
.compose-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.send{border-radius:50%;background:#222;color:white;font-size:18px;width:36px;height:36px;padding:0}.send:hover{background:#444}
.toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}input[type=checkbox]{accent-color:#333}
dialog{border:1px solid var(--border);border-radius:17px;width:min(710px,92vw);max-height:80vh;padding:22px;box-shadow:0 18px 80px #0003}dialog::backdrop{background:#0006}dialog h2{margin-top:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f7f7;padding:13px;border-radius:10px;max-height:260px;overflow:auto}.muted{color:var(--muted)}
@media(max-width:780px){.side{width:180px;min-width:150px}.toolbar{padding:0 8px;flex-wrap:wrap;height:auto;min-height:65px}.toolbar .name{display:none}.messages{padding:12px}.composer-wrap{padding:10px}}
.toast-area{position:fixed;top:18px;left:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:min(420px,90vw);pointer-events:none}.toast{pointer-events:auto;background:#202733;color:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 12px 35px #0003;display:flex;align-items:center;gap:12px;line-height:1.6;border-right:4px solid #6fa1ff}.toast.error{border-right-color:#e76666}.toast.success{border-right-color:#51be87}.toast button{margin-right:auto;color:#fff;padding:3px 8px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.primary-action{background:#232323;color:#fff}.primary-action:hover{background:#454545}
.activity{font-size:12px;color:#687282;display:flex;align-items:center;gap:8px;padding:8px 16px}.activity-dot{width:8px;height:8px;border-radius:50%;background:#8b929d}.activity.running .activity-dot{background:#25a776;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.2;transform:scale(.7)}}.file-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.file-chip{padding:6px 10px;border-radius:10px;background:#edf3fc;color:#2b4e73;font-size:12px}.small-action{padding:7px 10px;border:1px solid #e1e5eb;border-radius:12px}.composer.drop-target{outline:3px dashed #578aca;background:#edf6ff}
.chat-row{display:flex;gap:3px;align-items:center}.chat-row>.item{flex:1;min-width:0}.chat-row>.small-action{flex:none;padding:4px 8px}#chatSearch{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px;margin:4px 0 8px;background:var(--bg);color:var(--text)}
.code-block{border:1px solid var(--border);border-radius:12px;margin:10px 0;overflow:hidden}.code-block pre{margin:0;max-height:420px;white-space:pre;overflow:auto;border-radius:0}.code-header{background:var(--sidebar);padding:5px 12px;display:flex;align-items:center;gap:8px}.code-header button{font-size:12px;border:1px solid var(--border);padding:5px 9px}.md-table{border-collapse:collapse;width:100%;margin:10px 0}.md-table td,.md-table th{border:1px solid var(--border);padding:7px;text-align:right}.markdown-heading{font-weight:700;font-size:1.12rem;margin-top:10px}
.markdown-list{padding-inline-start:24px;margin:8px 0;line-height:1.75}
.markdown-list li{margin-bottom:3px}
.markdown-quote{margin:9px 0;padding:8px 12px;border-right:3px solid var(--border);color:var(--muted);background:var(--sidebar);border-radius:8px}
.markdown-line code,.md-table code{background:var(--sidebar);border-radius:5px;padding:1px 5px;direction:ltr}
.markdown-line a,.markdown-quote a{color:#3975c2;text-decoration:underline}.artifact-panel{width:min(42vw,540px);border-right:1px solid var(--border);background:var(--bg);overflow:auto;padding:12px}.artifact-panel[hidden]{display:none}.artifact-heading{display:flex;justify-content:space-between;align-items:center}.artifact-panel iframe{width:100%;height:70vh;border:1px solid var(--border)}@media(max-width:860px){.artifact-panel{position:fixed;z-index:20;inset:0 30% 0 0;width:70%;box-shadow:0 0 15px #0002}}
body.theme-dark{color-scheme:dark;--bg:#171b22;--sidebar:#1f2630;--text:#e6eaf0;--muted:#a0aab7;--border:#344154;--hover:#2c3544;--accent:#8cbaff}body.theme-dark .composer,body.theme-dark select{background:#222b37;color:var(--text)}body.theme-dark .msg,body.theme-dark dialog{background:var(--bg);color:var(--text)}body.theme-dark pre{background:#283442;color:#e7ecf6}body.theme-dark .item.active{background:#34455b}body.theme-dark .pill,body.theme-dark .small-action{border-color:var(--border)}
.permission-row{display:flex;gap:8px;align-items:center;padding:6px 3px;border-bottom:1px solid var(--border)}.permission-row[hidden]{display:none}
.activity-entry{padding:8px;border-bottom:1px solid var(--border);line-height:1.6}
.builtin-card{padding:12px;margin:8px 0;border:1px solid var(--border);border-radius:12px}.builtin-card p{margin:5px 0;color:var(--muted)}.builtin-card button{border:1px solid var(--border)}

.nav-details{border-radius:10px;margin:3px 0}.nav-details>summary{cursor:pointer;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:13px;list-style-position:inside}.nav-details>summary:hover{background:var(--hover)}.nav-details .item{padding-inline-start:17px;white-space:normal;overflow-wrap:anywhere}.nav-details[open]{background:var(--bg);border:1px solid var(--border)}.nav-details summary:focus-visible,.item:focus-visible,.pill:focus-visible{outline:2px solid #4b89d9;outline-offset:2px}

</style></head><body><div class="shell">
<aside class="side"><div class="brand">AI Control</div><button class="item" id="new">＋ שיחה חדשה</button><div class="section">השיחות שלך</div><input id="chatSearch" placeholder="חיפוש בכל השיחות..." aria-label="חיפוש בשיחות"><button class="item" id="backupChats">↓ גיבוי שיחות ל־JSON</button><button class="item" id="restoreChats">↑ שחזור שיחות מגיבוי</button><div id="chats"></div><div class="side-actions">
 <button class="item" id="toolsCatalog">☷ כלים זמינים לסוכן</button>

</div></aside>
<main class="main"><div class="toolbar"><span class="name">AI Control Desktop</span><button class="pill" id="uiPrefs">⚙ מראה</button><button class="pill" id="account">החשבון שלי</button><button class="pill" id="login">התחבר ל־ChatGPT</button><select id="models" aria-label="מודל"></select><button class="pill" id="compareModels">⇄ השווה מודלים</button><button class="pill" id="parallelAnalysis">◈ צוות ניתוח</button><button class="pill" id="localAI">✧ AI מקומי</button><button class="pill" id="agentActivity">☷ פעילות הסוכן</button><button class="pill" id="stop">עצור סוכן</button><span id="state">לא מחובר</span></div>
<div class="messages" id="scroll"><div class="thread" id="thread"><div class="welcome">איך אפשר לעזור היום?</div></div></div>
<div class="composer-wrap"><div id="activity" class="activity"><span class="activity-dot"></span><span id="activityText">מוכן לשיחה</span></div><div class="composer"><div id="fileChips" class="file-chips"></div><textarea id="prompt" placeholder="שלח הודעה או בקש לבצע פעולה במחשב…" aria-label="הודעה"></textarea><div class="compose-actions"><button class="small-action" id="voiceRecord" title="הקלטה מקומית במיקרופון">🎙 הקלט</button><button class="small-action" id="attach" title="צרף מסמך" aria-label="צרף מסמך">📎 צרף קובץ</button><label class="toggle"><input type="checkbox" id="agent" checked> מצב סוכן מחשב</label><button class="send" id="send" aria-label="שלח">↑</button></div></div></div></main><aside id="artifactPanel" class="artifact-panel" hidden><div class="artifact-heading"><strong id="artifactTitle">תצוגת תוצר</strong><button id="closeArtifact" aria-label="סגור תצוגה">×</button></div><div id="artifactContent"></div></aside></div>
<div id="toastArea" class="toast-area" role="status" aria-live="polite"></div><dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">אישור פעולה</h2><p id="confirmText"></p><div class="dialog-actions"><button id="confirmCancel">ביטול</button><button class="primary-action" id="confirmAccept">אישור</button></div></dialog><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button id="close">סגור</button></div></dialog>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script><script>
let bridge=null;let working=false;const activityHistory=[];
const $=id=>document.getElementById(id);
$('closeArtifact').onclick=()=>$('artifactPanel').hidden=true;
function notify(message,kind='info'){
 const item=document.createElement('div');item.className='toast '+kind;
 const label=document.createElement('span');label.textContent=String(message);item.append(label);
 const close=document.createElement('button');close.textContent='×';close.setAttribute('aria-label','סגור התראה');close.onclick=()=>item.remove();item.append(close);
 $('toastArea').append(item);
 window.setTimeout(()=>item.remove(),7000);
}
const ALLOWED_DROPPED_EXT=/\.(txt|md|json|csv|py|js|html|css)$/i;
const composer=document.querySelector('.composer');
composer.addEventListener('dragover',event=>{event.preventDefault();composer.classList.add('drop-target')});
composer.addEventListener('dragleave',()=>composer.classList.remove('drop-target'));
composer.addEventListener('drop',async event=>{
 event.preventDefault();composer.classList.remove('drop-target');
 const files=Array.from(event.dataTransfer?.files||[]).slice(0,12);
 for(const file of files){
  try{
   if(/\.(png|jpg|jpeg)$/i.test(file.name)&&file.size<=5000000){
    const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(Error('טעינת קובץ נכשלה'));reader.readAsDataURL(file)});
    const base64=data.slice(data.indexOf(',')+1);
    const result=await call('attach_image_base64',file.name,base64);
    const chip=element('button','🖼 '+result.name,$('fileChips'));chip.className='file-chip';
    chip.onclick=()=>{
     const panel=modal('תצוגה מקדימה: '+result.name);
     const preview=document.createElement('img');preview.src=data;preview.alt=result.name;
     preview.style.maxWidth='100%';preview.style.maxHeight='60vh';panel.append(preview);
    };
   }else if(ALLOWED_DROPPED_EXT.test(file.name)&&file.size<=1000000){
    const text=await file.text();
    const result=await call('attach_text',file.name,text);
    const chip=element('button','📄 '+result.name,$('fileChips'));
    chip.className='file-chip';chip.title='לחץ לתצוגה מקדימה';
    chip.onclick=()=>{const panel=modal('תצוגה מקדימה: '+result.name);element('pre',text.slice(0,8000),panel)};
   }else{notify('גרירה אינה תומכת בקובץ '+file.name,'error')}
  }catch(error){notify(error.message,'error')}
 }
});
function askConfirm(message){return new Promise(resolve=>{
 const dialog=$('confirmDialog');
 $('confirmText').textContent=message;
 function done(answer){dialog.close();resolve(answer)}
 $('confirmCancel').onclick=()=>done(false);
 $('confirmAccept').onclick=()=>done(true);
 dialog.oncancel=e=>{e.preventDefault();done(false)};
 dialog.showModal();
})}
function call(method,...args){return new Promise((resolve,reject)=>{if(!bridge)return reject(Error("החיבור למחשב אינו זמין"));bridge[method](...args,r=>{try{if(typeof r!=='string'||!r.trim())throw Error('הפעולה לא החזירה תשובה. נסה לעדכן את התוכנה.');const data=JSON.parse(r);if(data.error)reject(Error(data.error));else resolve(data)}catch(e){reject(e)}})})}
function status(value){$('state').textContent=value}
function activity(value,running=false){$('activityText').textContent=value;$('activity').classList.toggle('running',running)}
function renderInlineMarkdown(target,value){
 const text=String(value);
 const token=/(\[([^\]]{1,180})\]\((https:\/\/[^\s)]+|http:\/\/[^\s)]+)\)|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*|`([^`\n]+)`)/g;
 let position=0,match;
 while((match=token.exec(text))!==null){
  if(match.index>position)target.append(document.createTextNode(text.slice(position,match.index)));
  if(match[2]){
   const a=document.createElement('a');a.textContent=match[2];
   a.href=match[3];a.target='_blank';a.rel='noopener noreferrer';
   target.append(a);
  }else if(match[4]){
   const b=document.createElement('strong');b.textContent=match[4];target.append(b);
  }else if(match[5]){
   const e=document.createElement('em');e.textContent=match[5];target.append(e);
  }else if(match[6]){
   const code=document.createElement('code');code.textContent=match[6];target.append(code);
  }
  position=token.lastIndex;
 }
 if(position<text.length)target.append(document.createTextNode(text.slice(position)));
}
function renderMarkdown(target,source){
 const lines=String(source).split('\n');let i=0;
 while(i<lines.length){
  const line=lines[i];
  if(/^\s*```/.test(line)){
   const language=line.trim().slice(3).trim().toLowerCase(),content=[];
   i++;while(i<lines.length&&!/^\s*```/.test(lines[i]))content.push(lines[i++]);
   if(i<lines.length)i++;
   const wrapper=element('div','',target);wrapper.className='code-block';
   const header=element('div',language||'קוד',wrapper);header.className='code-header';
   const copy=element('button','העתק קוד',header);
   copy.onclick=()=>navigator.clipboard.writeText(content.join('\n')).then(()=>notify('הקוד הועתק','success')).catch(()=>notify('ההעתקה נכשלה','error'));
   if(['html','htm'].includes(language)){
    const preview=element('button','תצוגת HTML',header);
    preview.onclick=()=>showArtifact('תצוגת HTML',content.join('\n'),'html');
   }
   const pre=element('pre','',wrapper),code=element('code',content.join('\n'),pre);code.dir='ltr';
   continue;
  }
  if(line.includes('|')&&i+1<lines.length&&/^\s*\|?[-:| ]+\|?\s*$/.test(lines[i+1])){
   const table=element('table','',target);table.className='md-table';
   const parse=row=>row.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
   const tr=element('tr','',table);
   parse(line).forEach(x=>{const th=element('th','',tr);renderInlineMarkdown(th,x)});i+=2;
   while(i<lines.length&&lines[i].includes('|')){
    const row=element('tr','',table);
    parse(lines[i++]).forEach(x=>{const td=element('td','',row);renderInlineMarkdown(td,x)});
   }
   continue;
  }
  const heading=line.match(/^(#{1,6})\s+(.+)$/);
  if(heading){const h=element('div','',target);h.className='markdown-line markdown-heading';renderInlineMarkdown(h,heading[2]);i++;continue}
  if(/^\s*([-*]|\d+\.)\s+/.test(line)){
   const container=element('ul','',target);container.className='markdown-list';
   while(i<lines.length&&/^\s*([-*]|\d+\.)\s+/.test(lines[i])){
    const li=element('li','',container);
    renderInlineMarkdown(li,lines[i++].replace(/^\s*([-*]|\d+\.)\s+/,''));
   }
   continue;
  }
  if(/^\s*>\s?/.test(line)){
   const quote=element('blockquote','',target);quote.className='markdown-quote';
   while(i<lines.length&&/^\s*>\s?/.test(lines[i])){
    renderInlineMarkdown(quote,lines[i++].replace(/^\s*>\s?/,''));
    quote.append(document.createElement('br'));
   }
   continue;
  }
  if(/^\s*([-*_]\s*){3,}$/.test(line)){element('hr','',target);i++;continue}
  const p=element('div','',target);p.className='markdown-line';
  renderInlineMarkdown(p,line||' ');i++;
 }
}
function showArtifact(title,content,type='text'){
 const panel=$('artifactPanel');panel.hidden=false;
 $('artifactTitle').textContent=title;
 const contentBox=$('artifactContent');contentBox.replaceChildren();
 if(type==='html'){
  const frame=document.createElement('iframe');frame.setAttribute('sandbox','');
  frame.setAttribute('referrerpolicy','no-referrer');
  frame.srcdoc='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:">'+content;
  contentBox.append(frame);
 }else{const pre=element('pre',content,contentBox);pre.dir='auto'}
}
function addMessage(role,text,index=null){
 const thread=$('thread');thread.querySelector('.welcome')?.remove();

     const line=element('p',(ready?'✓ ':'○ ')+name+(ready?' — זמין':' — דרוש רכיב נוסף'),results);

    }

   }catch(error){notify(error.message,'error')}
  };
  element('h3','התקנת מנועים אופציונליים',body);
  element('p','ההתקנה דורשת Python במחשב, עשויה להוריד קבצים גדולים ולהריץ קוד של חבילות חיצוניות. נדרש אישור נפרד. מודלים אינם יורדים אוטומטית.',body);
  const features=[
   ['speech','תמלול וקול מקומי'],
   ['embedding','חיפוש סמנטי עם Embeddings'],

  ];
  const checks=[];

   const row=element('label','',body);row.style.display='block';row.style.margin='8px 0';
   const check=document.createElement('input');check.type='checkbox';check.value=name;
   row.append(check,document.createTextNode(' '+label));checks.push(check);
  }
  const install=element('button','התקן מנועים שנבחרו',body);install.className='small-action';
  install.onclick=async()=>{
   const chosen=checks.filter(item=>item.checked).map(item=>item.value);
   if(!chosen.length){notify('יש לבחור לפחות מנוע אחד','error');return}
   try{
    await call('setup_local_ai',JSON.stringify(chosen));
    notify('התקנת המנועים התחילה; יידרש אישור מפורש','success');
   }catch(error){notify(error.message,'error')}
  };
  verify.click();
 }catch(error){notify(error.message,'error')}
};

$('compareModels').onclick=()=>{
 const options=Array.from($('models').options);

 const select=document.createElement('select');
 for(const o of options){const option=document.createElement('option');option.value=o.value;option.textContent=o.textContent;select.append(option)}

 };

 const body=modal('התאמה אישית של הממשק');

 }

 element('label','גודל גופן',body);

 element('p','Ctrl+Enter לשליחה · Ctrl+K לחיפוש בשיחות · Ctrl+N לשיחה חדשה · Escape לסגירה',body);
};
window.addEventListener('keydown',event=>{
 if(!(event.ctrlKey||event.metaKey)){if(event.key==='Escape'){$('artifactPanel').hidden=true}return}
 const key=event.key.toLowerCase();
 if(key==='enter'){event.preventDefault();send()}
 if(key==='k'){event.preventDefault();$('chatSearch').focus()}
 if(key==='n'){event.preventDefault();call('new_chat').then(showChat).catch(e=>notify(e.message,'error'))}
});
$('account').onclick=async()=>{try{const a=await call('account_details');const body=modal('החשבון והנתונים שלי');element('p',a.connected?'מחובר ל־ChatGPT':'לא מחובר',body);element('p','כתובת חשבון: '+a.email,body);element('p','מספר מודלים זמינים: '+a.model_count,body);element('p','מודלים: '+(a.models.join(', ')||'לא זמין'),body);element('p','נתוני שימוש: '+a.usage,body);element('p','מסד השיחות: '+a.history_path,body);element('p','יכולות מותקנות: '+a.capability_count,body)}catch(e){notify(e.message,'error')}};
$('attach').onclick=async()=>{activity('בוחר ומעבד קובץ…',true);try{const a=await call('pick_attachment');if(a.cancelled){activity('מוכן לשיחה');return}
for(const [offset,file] of (a.items||[]).entries()){
 const chip=element('button',(file.image?'🖼 '+file.name:'📄 '+file.name+' · '+file.characters+' תווים'),$('fileChips'));

activity((a.items||[]).length+' קבצים צורפו · המידע לא הועבר עדיין למודל');}catch(e){notify(e.message,'error');activity('קריאת הקובץ נכשלה')}};

$('stop').onclick=()=>call('toggle_agent').then(x=>{status(x.message);$('stop').textContent=x.enabled?'עצור סוכן':'המשך סוכן';$('agent').checked=x.enabled}).catch(e=>notify(e.message,'error'));
$('send').onclick=send;
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
async function send(){
if(working)return;
const text=$('prompt').value.trim();
if(!text)return;
if(!$('models').value){status('יש להתחבר ולבחור מודל לפני השליחה');return}
working=true;activityHistory.length=0;$('send').disabled=true;activity('שולח למודל…',true);
try{
  await call('send',text,$('models').value,$('agent').checked);
  $('prompt').value='';$('fileChips').replaceChildren();
  addMessage('user',text);
  if(working){status('הסוכן עובד…');activity('הסוכן מתכנן ומבצע שלבים…',true)}
}catch(e){
  status('שליחה נכשלה: '+e.message);activity('שליחה נכשלה');
  working=false;$('send').disabled=false;
}}
function updateModels(models){const select=$('models');select.replaceChildren();for(const m of models){const o=document.createElement('option');o.value=m[0];o.textContent=m[1];select.append(o)}}
if(!window.qt||!qt.webChannelTransport){status('גשר Windows אינו זמין. בדוק את התקנת Qt WebEngine.')}else new QWebChannel(qt.webChannelTransport,channel=>{bridge=channel.objects.api;bridge.event.connect(raw=>{const msg=JSON.parse(raw);if(msg.type==='extension_draft'){
 if(msg.capability_id){notify('טיוטת קוד חדשה נוצרה: '+msg.name,'success');inspectCapability(msg.capability_id).catch(e=>notify(e.message,'error'))}
 if(msg.error){notify(msg.error,'error');}
 else if(msg.manifest){
  const preview=JSON.stringify(msg.manifest,null,2);
  const panel=modal('הרחבה מוכנה לבדיקה');
  element('p','בדוק את רצף הכלים. ההרחבה תותקן כמושבתת ולא תופעל אוטומטית.',panel);
  element('pre',preview,panel);
  const install=element('button','התקן הרחבה מושבתת',panel);
  install.className='primary-action';
  install.onclick=async()=>{if(await askConfirm('להתקין את ההרחבה במצב מושבת, בלי להריץ אותה?')){
    try{await call('install_extension',JSON.stringify(msg.manifest));notify('ההרחבה הותקנה כמושבתת','success');extensions()}
    catch(e){notify(e.message,'error')}
  }};
 }
}if(msg.type==='reminder'){notify('⏰ תזכורת: '+msg.title,'success');activity('תזכורת: '+msg.title,false)}if(msg.type==='approval'){activity('ממתין לאישור פעולה…',true);askConfirm(msg.description).then(ok=>call('approval_reply',ok).catch(e=>notify(e.message,'error')))}if(msg.type==='activity'){activityHistory.push(String(msg.text||'').slice(0,250));if(activityHistory.length>100)activityHistory.shift();activity(msg.text,true)}if(msg.type==='voice_transcript'){
 $('prompt').value=msg.text||'';
 activity('תמלול הקול הושלם — בדוק את הטקסט ושלח',false);
 notify('תמלול הקול הוכנס לתיבת ההודעה לבדיקה','success');
}
if(msg.type==='message')addMessage(msg.role,msg.text);if(msg.type==='models'){updateModels(msg.models);status(msg.status)}if(msg.type==='status'){status(msg.text);activity(msg.text,false)}if(msg.type==='finished'){working=false;$('send').disabled=false;activity('הפעולה הסתיימה');loadChats()}});call('session').then(d=>{updateModels(d.models);status(d.status)});call('chats').then(d=>call('select_chat',d.active).then(showChat));});
</script></body></html>

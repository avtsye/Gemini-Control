<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Control</title><style>
:root{font-family:system-ui,"Segoe UI",Arial;color-scheme:light}*{box-sizing:border-box}body{margin:0;width:372px;background:#f5f7fa;color:#1d293b}header{padding:20px;background:#fff;border-bottom:1px solid #e3e8f0}h1{font-size:19px;margin:0}header p,.hint{font-size:12px;color:#596b84;line-height:1.6}header p{margin:5px 0 0}main{padding:15px;display:grid;gap:12px}.card{background:white;border:1px solid #e1e7f1;border-radius:14px;padding:15px;display:grid;gap:10px}button{cursor:pointer;background:#2257bd;color:white;border:0;border-radius:9px;font:600 14px system-ui;padding:12px}button.sub{background:#eef2fa;color:#224475}button:disabled{opacity:.55}label{font-size:13px;font-weight:650}input,textarea{font:inherit;box-sizing:border-box;border:1px solid #bec9d9;border-radius:8px;padding:10px;width:100%}textarea{min-height:100px;resize:vertical}details{background:white;border:1px solid #e1e7f1;border-radius:12px;padding:12px}summary{cursor:pointer;font-size:13px;font-weight:600}#response{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}#response.error{color:#ac302f}#approve,#cancel{display:none}#status,.hint{font-size:12px;color:#596b84}#apiKey{direction:ltr}</style></head><body>
<header><h1>Gemini Control</h1><p>סוכן AI לדפדפן ולמחשב שלך · הפעולות נעשות באישורך</p></header><main>
<section class="card"><strong>מה תרצה לעשות?</strong><button id="agent">פתח את הסוכן והקלד בקשה ←</button><span class="hint">זהו המסך הראשי. אין צורך לבחור מראש בין כלים שונים.</span><button id="workspace" class="sub">עבודה ישירה עם קבצים</button></section>
<details id="browserTools"><summary>פעולה באתר הפתוח בכרום</summary><div style="display:grid;gap:9px;margin-top:12px"><label for="request">מה לעשות באתר?</label><textarea id="request" placeholder="למשל: סכם את הדף הפתוח"></textarea><button id="plan">הצע פעולה</button><span id="status"></span><div id="response" role="status" aria-live="polite">הפעולה תוצג לאישור לפני הביצוע.</div><button id="approve">אשר ובצע</button><button id="cancel" class="sub">בטל</button></div></details>
<details><summary>הגדרות (נדרש פעם אחת)</summary><div style="display:grid;gap:8px;margin-top:10px"><label for="apiKey">מפתח Gemini API</label><input id="apiKey" type="password" autocomplete="off" placeholder="הדבק מפתח API"><button id="save" class="sub">שמור מפתח</button><span class="hint">נשמר מקומית בכרום. תוכן שתבחר לניתוח יישלח לשירות Gemini.</span></div></details>
</main><script src="popup.js"></script></body></html>
